[project]
name = "vulners"
version = "4.0.0"
description = "Python SDK for the Vulners vulnerability intelligence API (https://vulners.com)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vulners", email = "info@vulners.com" }]
maintainers = [{ name = "Vulners", email = "info@vulners.com" }]
keywords = [
    "security",
    "vulnerability",
    "vulners",
    "CVE",
    "CVSS",
    "EPSS",
    "exploit",
    "threat-intelligence",
    "vulnerability-management",
    "sbom",
    "audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "orjson>=3.11,<4",
    "typing-extensions>=4.12",
    # base.py (legacy shim layer) imports typing_inspection directly; keep it
    # explicit so a pydantic that drops the transitive dep can't break imports.
    "typing-inspection>=0.4",
    # HTTP/2 transport, on by default. Pure-Python, so no wheel/build concern.
    "h2>=4,<5",
    # Streaming multi-member zip archive decode (used by _streaming). Pure-Python.
    "stream-unzip>=0.0.100,<0.1",
    # Response compression: httpx advertises br/zstd and decompresses them
    # transparently only when these decoders are importable, so they are core
    # (an extra would be opt-in and never help the default `pip install vulners`).
    # Both ship cp310–cp314 wheels, so `pip install vulners` never builds from source.
    # Upper-capped at the next major so a wheel/ABI-breaking release can't be
    # pulled in silently; bump the cap deliberately when validated.
    "brotli>=1.1,<2",
    "zstandard>=0.22,<1",
    # ISA-L accelerated gzip inflate on the multi-GB archive hot path (drop-in
    # zlib/gzip replacement). Ships cp310–cp314 wheels.
    "isal>=1.7,<2",
    # Streaming JSON-array parser for the bulk archive path (a collection is one
    # big JSON array): yields elements without buffering the whole array. Pure
    # Python with optional C backends; the pure-Python backend needs no wheel, so
    # `pip install vulners` / `uv sync` never builds from source on any 3.10–3.14.
    "ijson>=3.2,<4",
]

[project.optional-dependencies]
# Agentic layer: ships a Model Context Protocol server (vulners-mcp).
mcp = ["fastmcp>=2.0,<4"]
# Opt-in OpenTelemetry tracing.
otel = ["opentelemetry-api>=1.20"]

[project.urls]
Homepage = "https://vulners.com"
Documentation = "https://docs.vulners.com/docs/api/"
Repository = "https://github.com/vulnersCom/api"
Changelog = "https://github.com/vulnersCom/api/blob/master/CHANGELOG.md"
Issues = "https://github.com/vulnersCom/api/issues"

[project.scripts]
# Model Context Protocol server (agentic layer). Requires the `mcp` extra:
#   pip install "vulners[mcp]" && vulners-mcp
vulners-mcp = "vulners._mcp.server:main"

# Dev toolchain (PEP 735 dependency groups; installed by `uv sync`).
# Conservative floors that resolve today; tightened to exact pins at lock time.
[dependency-groups]
# Minimal group to RUN the tests. The CI test matrix installs only this group.
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pytest-xdist>=3.6",
    "pytest-cov>=5",
    "coverage>=7",
    "pytest-codspeed>=2.2.1",
    # tomllib is stdlib on 3.11+; the packaging/metadata tests use this backport
    # on the 3.10 floor so they no longer skip there.
    "tomli>=2; python_version < '3.11'",
]
# Lint/typecheck only; the CI lint job installs this.
lint = [
    "ruff>=0.11.8",
    "mypy>=1.15",
    "basedpyright>=1.21",
]
# Documentation site: Material theme + mkdocstrings API reference + llms.txt
# emitter. Its own group so a `mkdocs build --strict` CI job installs just this.
docs = [
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mkdocs-llmstxt>=0.5.0",
]
# Code generation (unasyncd -> msgspec 0.18.6). Isolated from the default `dev`
# sync so a plain `uv sync` never pulls msgspec, and never affects tests/lint/docs
# or the runtime package. Run `make unasync` / `make unasync-check` on Python
# <=3.12 (msgspec 0.18.6 has cp310-cp312 wheels only). Note: a newer unasyncd that
# would allow msgspec 0.19+ (with 3.13/3.14 wheels) pins rich incompatibly with
# the `mcp` extra (fastmcp), so the tool stays here. ruff is included because
# unasyncd shells out to it (ruff_fix / ruff_format).
codegen = ["unasyncd>=0.8.1", "ruff>=0.11.8"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.uv]
# Reproducible resolution: pin the dev/CI dependency universe to a fixed date so
# the committed uv.lock resolves identically everywhere (a bare `uv sync
# --locked` in CI has no machine-global cutoff, so without this the lock would
# be seen as stale). Dev/build tooling only — end users are unaffected.
exclude-newer = "2026-08-14T00:00:00Z"

[tool.unasyncd]
# Build-time generation of the sync mirror from the async source of truth. Both
# the async source and the generated sync output are committed; `unasyncd --check`
# gates that they stay in sync (`make unasync` / `make unasync-check`).
add_editors_note = true
transform_docstrings = true
ruff_fix = true
ruff_format = true

[tool.unasyncd.files]
"src/vulners/_ratelimit_async.py" = "src/vulners/_ratelimit.py"
"src/vulners/_transport_client_async.py" = "src/vulners/_transport_client_sync.py"
"src/vulners/_resources/_async" = "src/vulners/_resources/_sync"

[tool.unasyncd.add_replacements]
# asyncio.sleep -> time.sleep is a unasyncd built-in; the Lock has no built-in, so
# map it (and its import) here so the sync RateLimitBucket uses a threading.Lock.
"asyncio.Lock" = "threading.Lock"
AsyncRateLimitBucket = "RateLimitBucket"
AsyncBaseResource = "BaseResource"
AsyncIterator = "Iterator"
AsyncSearchPage = "vulners._pagination.SearchPage"
aiter_collection = "iter_collection"
aiter_query = "iter_query"
"asyncio.to_thread" = "vulners._base_client._call_blocking"
AsyncSearch = "Search"
AsyncAudit = "Audit"
AsyncArchive = "Archive"
AsyncMisc = "Misc"
AsyncReport = "Report"
AsyncStix = "Stix"
AsyncSubscriptions = "Subscriptions"
AsyncSubscriptionsV4 = "SubscriptionsV4"
AsyncWebhooks = "Webhooks"
AsyncVscanner = "Vscanner"
AsyncVscannerLicenses = "VscannerLicenses"
AsyncVscannerProjects = "VscannerProjects"
AsyncVscannerResults = "VscannerResults"
AsyncVscannerTasks = "VscannerTasks"
AsyncAPIClient = "SyncAPIClient"
AsyncVulners = "Vulners"

# I/O-client-only replacements, scoped to the transport client so the httpx
# response-method and transport renames can't leak into resource generation.
[tool.unasyncd.per_file_add_replacements."src/vulners/_transport_client_async.py"]
AsyncStreamContext = "SyncStreamContext"
AsyncStreamedAPIResponse = "vulners._response.StreamedAPIResponse"
AsyncVulnersTransport = "vulners._transport.VulnersTransport"
AsyncRateLimitBucket = "vulners._ratelimit.RateLimitBucket"
"httpx.AsyncClient" = "httpx.Client"
"httpx.AsyncHTTPTransport" = "httpx.HTTPTransport"
aiter_bytes = "iter_bytes"
aread = "read"
aclose = "close"

# The async base resource type-hints its client as AsyncAPIClient; the sync
# mirror must point at SyncAPIClient in the sync client module (qualified so the
# TYPE_CHECKING import is rewritten, not just the name).
[tool.unasyncd.per_file_add_replacements."src/vulners/_resources/_async/_base.py"]
AsyncAPIClient = "vulners._transport_client_sync.SyncAPIClient"

[build-system]
# uv_build backend (src-layout auto-detected: src/vulners). Floor aligned to the
# locally installed uv (0.11.29).
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 98
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/vulners/vulners", "src/vulners/base.py", "src/vulners/vscanner.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PYI", "PT"]
# UP040 rewrites TypeAlias into `type X = ...` (3.12+ only) — off for the 3.10 floor.
ignore = ["UP040"]

[tool.ruff.lint.per-file-ignores]
# Tests: allow bare asserts and relax opinionated pytest-style rules (PT*) and
# long data lines — these flag style, not bugs, in the existing v3 test suite.
"tests/**" = ["ANN", "S101", "PT", "E501", "SIM117"]
# Generated sync resources: an async generator relays items with `async for ...:
# yield`, which unasyncd turns into `for ...: yield`; `yield from` is illegal in
# the async source, so UP028 cannot be honoured there. Ignore it in the mirror.
"src/vulners/_resources/_sync/**" = ["UP028"]
# Generated bulletin models: authored field descriptions ride as one-line attribute
# docstrings that can exceed the line length; the content is generated, not styled.
"src/vulners/_models/bulletins/**" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
# Legacy shim layer (v3 modules) is excluded from strict until a later tightening pass.
exclude = "^src/vulners/(vulners/|base\\.py|vscanner\\.py)"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_reexport = false

[[tool.mypy.overrides]]
# Optional, lazily-imported deps without type stubs (installed only with their
# extra/group). Ignore their missing imports so the lint job (which omits them)
# stays clean.
module = ["fastmcp.*", "stream_unzip", "ijson"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]
exclude = ["src/vulners/vulners", "src/vulners/base.py", "src/vulners/vscanner.py"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Any warning is an error: a DeprecationWarning from our code (src/vulners) or the
# suite fails the run. Tests that intentionally exercise the deprecated v3 shims
# opt back in locally with `pytest.warns(...)` / `@pytest.mark.filterwarnings`,
# never by weakening this global gate. Third-party warnings we cannot control are
# narrowed here one-by-one (prefer none).
filterwarnings = ["error"]
# Exclude the pytest-codspeed micro-benchmarks AND the opt-in live tests from the
# default run: benchmarks live under tests/benchmarks (run with `--codspeed -m
# benchmark`); live tests hit the real API and must never run under the default
# suite / xdist (parallel API mutations) — run them explicitly with `make live` /
# `make live-mcp`, which re-select them with `-m live`.
addopts = "-m 'not benchmark and not live'"
markers = [
    "live: hits the real Vulners API; needs VULNERS_API_KEY env or tests/live.local.toml",
    "benchmark: a pytest-codspeed micro-benchmark (excluded from the default run)",
]

[tool.coverage.run]
branch = true
source = ["vulners"]
parallel = true
concurrency = ["thread", "multiprocessing"]
# Config-driven gate scope: measure the WHOLE package and subtract only what is
# gated elsewhere, so any new module lands inside the 100% gate by default
# (listing modules with --cov flags erodes silently as modules are added).
omit = [
    # Legacy v3 layer: exercised by the v3 suite separately, outside this gate.
    "*/vulners/base.py",
    "*/vulners/vscanner.py",
    "*/vulners/vulners/*",
    # MCP agentic layer: lives behind the optional `mcp` extra (fastmcp), which
    # the default test env does not install, so it is gated at 100% by the
    # separate `make cov-mcp` job instead of this run.
    "*/vulners/_mcp/*",
]

[tool.coverage.report]
show_missing = true
# Gate scope: the NEW v4 core is held at 100% branch coverage (see `make cov`,
# which measures exactly the v4 modules). The legacy v3 layer (base.py /
# vscanner.py / vulners/**) is exercised by the v3 test suite separately and is
# intentionally outside this gate. `make cov` restricts measurement to the v4
# modules via --cov=, so this floor applies to that scoped run.
fail_under = 100
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

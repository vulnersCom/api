[project]
name = "vulners"
version = "4.0.0.dev0"
description = "Python SDK for the Vulners vulnerability intelligence API (https://vulners.com)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vulners", email = "info@vulners.com" }]
maintainers = [{ name = "Vulners", email = "info@vulners.com" }]
keywords = [
    "security",
    "vulnerability",
    "vulners",
    "CVE",
    "CVSS",
    "EPSS",
    "exploit",
    "threat-intelligence",
    "vulnerability-management",
    "sbom",
    "audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "orjson>=3.11,<4",
    "typing-extensions>=4.12",
    # base.py (legacy shim layer) imports typing_inspection directly; keep it
    # explicit so a pydantic that drops the transitive dep can't break imports.
    "typing-inspection>=0.4",
]

[project.optional-dependencies]
# Bulk NDJSON fast-path decoder; narrow use (streaming), decided by WP7 benchmark.
fast = ["msgspec>=0.19,<1"]
# Streaming multi-member zip archive decode (lazily imported by _streaming).
stream-zip = ["stream-unzip>=0.0.100,<0.1"]
# HTTP/2 transport.
http2 = ["h2>=4,<5"]
# Agentic layer: ships a Model Context Protocol server (vulners-mcp).
mcp = ["fastmcp>=2.0"]
# Opt-in OpenTelemetry tracing.
otel = ["opentelemetry-api>=1.20"]

[project.urls]
Homepage = "https://vulners.com"
Documentation = "https://docs.vulners.com/docs/api/"
Repository = "https://github.com/vulnersCom/api"
Changelog = "https://github.com/vulnersCom/api/blob/master/CHANGELOG.md"
Issues = "https://github.com/vulnersCom/api/issues"

# Dev toolchain (PEP 735 dependency groups; installed by `uv sync`).
# Conservative floors that resolve today; tightened to plan pins (§7.1) at lock (WP8/WP9).
[dependency-groups]
dev = [
    "ruff>=0.11.8",
    "mypy>=1.15",
    "basedpyright>=1.21",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pytest-xdist>=3.6",
    "pytest-cov>=5",
    "coverage>=7",
    "unasyncd>=0.8.1",
    # Runtime optional extra, installed for tests exercising the zip stream path.
    "stream-unzip>=0.0.100,<0.1",
]

[tool.uv]
# The [fast] and [mcp] extras carry mutually incompatible msgspec constraints
# (msgspec>=0.19 for the bulk NDJSON fast-path vs. the pin fastmcp transitively
# requires). They are never installed together, so declare them conflicting;
# this lets the universal resolver fork them cleanly instead of failing.
conflicts = [[{ extra = "fast" }, { extra = "mcp" }]]
# unasyncd 0.10.x (the plan-pinned build-time sync generator) publishes past the
# environment's global exclude-newer cutoff; allow it explicitly so `uv run`
# resolves it stably instead of re-resolving on every invocation.
exclude-newer-package = { unasyncd = "2026-07-01T00:00:00Z" }

[tool.unasyncd]
# Build-time generation of the sync mirror from the async source of truth. Both
# the async source and the generated sync output are committed; `unasyncd --check`
# gates that they stay in sync (see scripts/unasync.py / `make unasync`).
add_editors_note = true
transform_docstrings = true
ruff_fix = true
ruff_format = true

[tool.unasyncd.files]
"src/vulners/_ratelimit_async.py" = "src/vulners/_ratelimit.py"
"src/vulners/_resources/_async" = "src/vulners/_resources/_sync"

[tool.unasyncd.add_replacements]
AsyncRateLimitBucket = "RateLimitBucket"
AsyncBaseResource = "BaseResource"
AsyncIterator = "Iterator"
AsyncSearchPage = "vulners._pagination.SearchPage"
aiter_collection = "iter_collection"
AsyncSearch = "Search"
AsyncAudit = "Audit"
AsyncArchive = "Archive"
AsyncMisc = "Misc"
AsyncReport = "Report"
AsyncStix = "Stix"
AsyncSubscriptions = "Subscriptions"
AsyncSubscriptionsV4 = "SubscriptionsV4"
AsyncWebhooks = "Webhooks"
AsyncVscanner = "Vscanner"
AsyncVscannerLicenses = "VscannerLicenses"
AsyncVscannerProjects = "VscannerProjects"
AsyncVscannerResults = "VscannerResults"
AsyncVscannerTasks = "VscannerTasks"
AsyncAPIClient = "SyncAPIClient"
AsyncVulners = "Vulners"

[build-system]
# uv_build backend (src-layout auto-detected: src/vulners). Floor aligned to the
# locally installed uv (0.11.26); plan target is >=0.11.29 — bumped at lock.
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 98
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/vulners/vulners", "src/vulners/base.py", "src/vulners/vscanner.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PYI", "PT"]
# UP040 rewrites TypeAlias into `type X = ...` (3.12+ only) — off for the 3.10 floor.
ignore = ["UP040"]

[tool.ruff.lint.per-file-ignores]
# Tests: allow bare asserts and relax opinionated pytest-style rules (PT*) and
# long data lines — these flag style, not bugs, in the existing v3 test suite.
"tests/**" = ["ANN", "S101", "PT", "E501", "SIM117"]
# Generated sync resources: an async generator relays items with `async for ...:
# yield`, which unasyncd turns into `for ...: yield`; `yield from` is illegal in
# the async source, so UP028 cannot be honoured there. Ignore it in the mirror.
"src/vulners/_resources/_sync/**" = ["UP028"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
# Legacy shim layer (v3 modules) is excluded from strict until WP6/WP8 tightening.
exclude = "^src/vulners/(vulners/|base\\.py|vscanner\\.py)"
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_reexport = false

[tool.pyright]
include = ["src"]
exclude = ["src/vulners/vulners", "src/vulners/base.py", "src/vulners/vscanner.py"]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits the real Vulners API; needs VULNERS_API_KEY env or tests/live.local.toml",
]

[tool.coverage.run]
branch = true
source = ["vulners"]
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.",
]

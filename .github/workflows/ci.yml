name: ci

on:
  push:
    branches: [v4.0]
  pull_request:
    branches: [v4.0]

# TODO(WP9/security-review): pin astral-sh/setup-uv to a commit SHA (the other
# actions are already SHA-pinned). Tags are used here on the dev branch only.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: install (locked)
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: import smoke
        run: uv run --python ${{ matrix.python-version }} python -c "import vulners; print(vulners.__version__)"
      - name: run tests (parallel; live-marked tests skip without an API key)
        run: uv run --python ${{ matrix.python-version }} pytest -n auto

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: install (locked)
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check src tests
      - name: ruff format --check
        run: uv run ruff format --check src tests
      - name: mypy (new modules; legacy shim layer excluded until WP8)
        run: uv run mypy
      - name: basedpyright verifytypes (non-blocking until WP8)
        run: uv run basedpyright --verifytypes vulners --ignoreexternal
        continue-on-error: true

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: build sdist and wheel
        run: uv build
      - name: twine check
        run: uvx twine check dist/*
      - name: install wheel into clean venv + import smoke
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          /tmp/wheel-venv/bin/python -c "import vulners; print(vulners.__version__)"

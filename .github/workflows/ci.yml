name: ci

on:
  push:
    branches: [v4.0]
  pull_request:
    branches: [v4.0]

# TODO(security-review): pin astral-sh/setup-uv to a commit SHA (the other
# actions are already SHA-pinned). Tags are used here on the dev branch only.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: install (locked, test group only)
        # Only the `test` group — not the code-gen tool (unasyncd -> msgspec
        # 0.18.6), which fails to build on 3.13/3.14 and isn't needed to run tests.
        run: uv sync --locked --no-default-groups --group test --python ${{ matrix.python-version }}
      - name: import smoke
        run: uv run --no-default-groups --group test --python ${{ matrix.python-version }} python -c "import vulners; print(vulners.__version__)"
      - name: run tests (parallel; live-marked tests skip without an API key)
        # Require the BC signature comparison on exactly the job whose interpreter
        # matches the surface.json baseline (3.12), so a matrix drift turns red.
        env:
          BC_SIGCHECK_REQUIRED: ${{ matrix.python-version == '3.12' && '1' || '' }}
        run: uv run --no-default-groups --group test --python ${{ matrix.python-version }} pytest -n auto

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: install (locked, lint group only)
        run: uv sync --locked --no-default-groups --group lint
      - name: ruff check
        run: uv run --no-default-groups --group lint ruff check src tests
      - name: ruff format --check
        run: uv run --no-default-groups --group lint ruff format --check src tests
      - name: mypy
        run: uv run --no-default-groups --group lint mypy
      - name: basedpyright type check
        run: uv run --no-default-groups --group lint basedpyright src
      - name: basedpyright verifytypes (non-blocking; legacy v3 layer has known gaps)
        run: uv run --no-default-groups --group lint basedpyright --verifytypes vulners --ignoreexternal
        continue-on-error: true

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: build sdist and wheel
        run: uv build
      - name: twine check
        run: uvx twine check dist/*
      - name: install wheel into clean venv + import smoke
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          /tmp/wheel-venv/bin/python -c "import vulners; print(vulners.__version__)"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: install (locked, test group only)
        run: uv sync --locked --no-default-groups --group test --python 3.12
      # The 100% floor comes from [tool.coverage.report] fail_under; this scopes
      # measurement to the v4 core modules (the legacy v3 layer is out of gate).
      - name: branch-coverage gate (v4 core must stay at 100%)
        run: >
          uv run --no-default-groups --group test --python 3.12
          pytest -n auto
          --cov=vulners._base_client --cov=vulners._client --cov=vulners._config
          --cov=vulners._exceptions --cov=vulners._logging --cov=vulners._models
          --cov=vulners._pagination --cov=vulners._ratelimit --cov=vulners._ratelimit_async
          --cov=vulners._resources --cov=vulners._response --cov=vulners._retry
          --cov=vulners._streaming --cov=vulners._transport
          --cov=vulners._transport_client_async --cov=vulners._transport_client_sync
          --cov=vulners._types --cov-branch --cov-report=term-missing

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # The MCP server lives behind the `mcp` extra (fastmcp), which cannot share
      # the default env, so it is measured on its own here at 100%.
      - name: run MCP server tests (isolated env with the mcp extra)
        run: >
          uv run --no-default-groups --extra mcp --with pytest --with pytest-asyncio --with pytest-cov
          pytest tests/test_mcp.py --cov=vulners._mcp --cov-branch
          --cov-report=term-missing --cov-fail-under=100

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Install the project + docs group so griffe can resolve runtime-dep
      # cross-references, then strict-build (any warning fails the job).
      - name: install (locked, docs group + project)
        run: uv sync --locked --no-default-groups --group docs
      - name: mkdocs build --strict
        run: uv run --no-default-groups --group docs mkdocs build --strict
